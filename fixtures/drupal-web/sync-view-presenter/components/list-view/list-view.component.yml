$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: List View
status: experimental
group: Data Display
description: >
  View wrapper — the wrapper component of the view mapping. Renders the view's rows in a rows
  slot and its empty text when there are none; receives the pager values as scalar props (the
  page-link markup itself comes from the Pager presenter).
provider: test_integration_drupal
thirdPartySettings:
  sdcStorybook:
    disableBasicStory: true
slots:
  rows:
    title: Rows
    description: The listed rows — each an SDC render of one row-bundle record in its listed view-mode.
  empty:
    title: Empty
    description: Text shown when the result has no rows.
props:
  type: object
  properties:
    title:
      title: Title
      type: string
      description: Optional listing heading.
    pager:
      title: Pager
      type: string
      enum: [full, mini, none]
      description: Pager kind of the view.
    items_per_page:
      title: Items per page
      type: integer
      description: Rows per page.
    page:
      title: Page
      type: integer
      description: Zero-based index of the displayed page.
    total:
      title: Total
      type: integer
      description: Result count across all pages.
